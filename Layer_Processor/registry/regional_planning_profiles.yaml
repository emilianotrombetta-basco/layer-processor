  "08":
    key: emilia_romagna
    names:
      it: "Emilia-Romagna"
    special_statute: false
    languages: [it]

    territorial_model:
      planning_levels: [regione, provincia, comune]
      processing_order: [regione, provincia, comune]
      expected_provinces: 9
      expected_municipalities: 330
      municipality_count_checked_at: "2026-07-30"
      province_roles:
        - {istat: "033", name: "Piacenza", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "034", name: "Parma", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "035", name: "Reggio nell'Emilia", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "036", name: "Modena", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "037", name: "Bologna", authority_type: citta_metropolitana, expected_instrument: PTM}
        - {istat: "038", name: "Ferrara", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "039", name: "Ravenna", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "040", name: "Forlì-Cesena", authority_type: provincia, expected_instrument: PTAV}
        - {istat: "099", name: "Rimini", authority_type: provincia, expected_instrument: PTAV}
      transition_note: >
        PTAV e PTM sono i nuovi strumenti strategici d'area vasta, ma non
        cancellano tutte le componenti dei PTCP. Ai sensi dell'art. 76 della
        L.R. 24/2017 continuano a essere efficaci le disposizioni e cartografie
        dei PTCP che recepiscono o integrano il PTPR, fino al loro superamento
        da parte della nuova pianificazione paesaggistica regionale.

    composition:
      fill_down_order: [PTR, PTPR, PTCP_PAESAGGISTICO, PTAV, PTM, PUG, PSC, RUE, POC, PRG]
      municipal_override: true
      mandatory_overlays: [TAVOLA_VINCOLI, RISCHIO_IDRAULICO, DISSESTO_GEOLOGICO]
      rule: >
        La disciplina del lotto deriva dal piano comunale vigente e dalle sue
        norme, letto insieme alla Tavola dei vincoli e alle prescrizioni
        sovraordinate. Nel PUG la strategia e gli areali per accordi operativi
        non attribuiscono da soli un diritto edificatorio puntuale. Nei Comuni
        non ancora coperti dal PUG restano da versionare gli strumenti
        previgenti effettivamente vigenti (PRG oppure PSC/POC/RUE).

    instruments:
      - key: PTR
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Regionale"
        aliases: [PTR]
        plan_type: regolatore
        status: effective_legacy_new_plan_in_preparation
        approved_at: "2010-02-03"
        legal_basis:
          - "L.R. 20/2000, art. 23"
          - "D.A.L. 276/2010"
          - "L.R. 24/2017, art. 40"
        coverage_scope: whole_region
        note: >
          Il PTR 2010 resta vigente nelle more del nuovo PTR unitario previsto
          dall'art. 40, che integrerà componente strategica, strutturale,
          paesaggistica e componente territoriale del PRIT.

      - key: PTPR
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Paesistico Regionale"
        aliases: [PTPR]
        plan_type: regolatore
        status: effective_in_adaptation
        approved_at: "1993"
        legal_basis:
          - "D.C.R. 1338/1993"
          - "D.Lgs. 42/2004"
          - "L.R. 24/2017, artt. 40, 64 e 76"
        coverage_scope: whole_region
        conformity_role: sovraordinato
        note: >
          Il PTPR 1993 è vigente ed è in adeguamento al Codice dei beni
          culturali e del paesaggio. La cartografia regionale originaria è
          storica; le specificazioni paesaggistiche efficaci sono spesso nelle
          componenti dei PTCP che continuano a produrre effetti.

      - key: PTAV
        level: provincia
        required: true
        expected_count: 8
        official_name: "Piano Territoriale di Area Vasta"
        aliases: [PTAV]
        plan_type: regolatore
        legal_basis:
          - "L.R. 24/2017, art. 42"
        coverage_scope: all_provinces_except_bologna
        conformity_role: strategico_area_vasta
        track:
          - approval_and_effective_dates
          - continuing_ptcp_landscape_components
          - logistics_and_productive_hubs
          - ecological_network
          - allocation_of_soil_consumption

      - key: PTM
        level: provincia
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Metropolitano di Bologna"
        aliases: [PTM]
        plan_type: regolatore
        legal_basis:
          - "L.R. 24/2017, art. 41"
        coverage_scope: bologna_metropolitan_city
        conformity_role: strategico_metropolitano
        note: >
          Comprende la disciplina metropolitana, inclusi perequazione,
          insediamenti di rilievo sovracomunale e logistica. Le parti del
          precedente PTCP individuate dall'Allegato B del PTM continuano a
          costituire pianificazione paesaggistica regionale.

      - key: PUG
        level: comune
        required: true
        expected_count: 330
        official_name: "Piano Urbanistico Generale"
        aliases: [PUG]
        plan_type: regolatore
        legal_basis:
          - "L.R. 24/2017, artt. 31-36"
        coverage_scope: each_municipality_or_associated_plan
        conformity_role: general_municipal_plan
        track:
          - administrative_status
          - approval_and_effective_dates
          - territory_classification
          - urbanized_territory_at_2018_01_01
          - historical_settlement_system
          - ordinary_regulation
          - operational_agreements
          - constraints_table
          - local_sustainability_assessment
          - technical_rules

      - key: LEGACY_MUNICIPAL_PLANS
        level: comune
        required: true
        expected_count: dynamic
        official_name: "Strumenti urbanistici comunali previgenti"
        aliases: [PRG, PSC, POC, RUE]
        plan_type: regolatore
        status: transitional_where_pug_not_effective
        legal_basis:
          - "L.R. 47/1978"
          - "L.R. 20/2000"
          - "L.R. 24/2017, artt. 3, 4 e 79"
        coverage_scope: municipalities_without_effective_pug
        processing_rule: >
          Non assumere automaticamente la triade PSC/POC/RUE: alcuni Comuni
          conservano strumenti PRG. Registrare per Comune l'atto vigente, le
          varianti, la disciplina operativa e la data di efficacia.

    soil_consumption:
      objective: saldo_zero_by_2050
      maximum_quota: "3% del territorio urbanizzato individuato al 1 gennaio 2018"
      legal_basis: "L.R. 24/2017, artt. 5 e 6"
      processing_rule: >
        Il 3% è la quota complessiva massima disciplinata dalla legge, soggetta
        a esclusioni, monitoraggio e allocazione della pianificazione di area
        vasta. Non convertirla in un diritto automatico di ciascun Comune o
        lotto e calcolare il saldo considerando anche le desigillazioni.

    expected_datasets:
      PUG:
        - source_theme: "Territorio urbanizzato al 1 gennaio 2018 e classificazione del territorio"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Sistema insediativo storico"
          canonical_classes: [PRG_EDIFICI_STORICI]
        - source_theme: "Disciplina regolativa ordinaria e accordi operativi"
          canonical_classes: [PRG_ZONING, TRASFORMAZIONI]
        - source_theme: "Dotazioni territoriali"
          canonical_classes: [SERVIZI_POI]
        - source_theme: "Tavola dei vincoli"
          canonical_classes: [VINCOLI_PAESAGGISTICI, VINCOLI_COMUNALI, RISCHIO_IDRAULICO, DISSESTO_GEOLOGICO]
      PSC:
        - source_theme: "Territori e assetto per ambiti"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Dotazioni e mobilità"
          canonical_classes: [SERVIZI_POI, VIABILITA]
        - source_theme: "Comuni presenti nella banca dati"
          canonical_classes: [PIANI_MATURITA]
      PTPR_PTAV_PTM:
        - source_theme: "Tutele paesaggistiche e storico-culturali"
          canonical_classes: [VINCOLI_PAESAGGISTICI, AREE_PROTETTE]
        - source_theme: "Rete ecologica, corsi d'acqua e territorio rurale"
          canonical_classes: [RETE_ECOLOGICA, ACQUE, AGRICOLTURA]

    recognition_hints:
      priority_terms:
        - PUG
        - PSC
        - POC
        - RUE
        - PRG
        - PTAV
        - PTM
        - PTPR
        - "territorio urbanizzato"
        - "classificazione del territorio"
        - "disciplina regolativa ordinaria"
        - "accordi operativi"
        - "tavola dei vincoli"
        - "sistema insediativo storico"
      policy_priorities:
        - consumo_di_suolo_a_saldo_zero_2050
        - rigenerazione_urbana
        - doppia_vigenza_ptav_ptm_e_componenti_paesaggistiche_ptcp
        - rischio_idraulico_e_dissesto
        - tutela_del_territorio_rurale

    official_portals:
      - key: planning_home
        purpose: "Quadro ufficiale della pianificazione territoriale regionale"
        url: "https://territorio.regione.emilia-romagna.it/programmazione-territoriale/pianificazione-territoriale"
      - key: planning_law
        purpose: "L.R. 24/2017 e atti di coordinamento"
        url: "https://territorio.regione.emilia-romagna.it/codice-territorio/disciplina-regionale/pianif-territoriale/legge-regionale-21-dicembre-2017-n-24"
      - key: geoportal
        purpose: "Catalogo e download dei dati geografici regionali"
        url: "https://geoportale.regione.emilia-romagna.it/"
      - key: moka_pug
        purpose: "Banca dati vettoriale dei PUG e relativo monitoraggio"
        url: "https://servizimoka.regione.emilia-romagna.it/mokaApp/apps/PUGH5/"
      - key: moka_psc
        purpose: "Mosaico informativo dei PSC secondo la L.R. 20/2000"
        url: "https://servizimoka.regione.emilia-romagna.it/mokaApp/apps/PSC/index.html"
      - key: municipal_status
        purpose: "Stato amministrativo degli strumenti urbanistici comunali"
        url: "https://territorio.regione.emilia-romagna.it/urbanistica/monitoraggio-lr-24-2017/banca-dati-amministrativa-puc"
      - key: ptcp_landscape
