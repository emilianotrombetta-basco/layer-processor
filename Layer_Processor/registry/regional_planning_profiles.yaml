# ============================================================================
# PROFILI REGIONALI DI PIANIFICAZIONE
# Descrivono ciò che il processore deve aspettarsi nei diversi ordinamenti
# regionali. Il profilo modifica la pipeline: livelli inesistenti vengono saltati,
# gli strumenti obbligatori diventano controlli di copertura e i temi locali sono
# ricondotti alle classi canoniche.
# ============================================================================

version: 1

defaults:
  planning_levels: [regione, provincia, comune]
  processing_order: [regione, provincia, comune]
  human_review_required: true

profiles:
  "02":
    key: valle_d_aosta
    names:
      it: "Valle d'Aosta"
      fr: "Vallée d'Aoste"
    special_statute: true
    languages: [it, fr]

    territorial_model:
      planning_levels: [regione, comune]
      processing_order: [regione, comune]
      expected_municipalities: 74
      skipped_levels:
        provincia:
          reason: >
            Non esiste un'amministrazione provinciale con un proprio livello
            ordinario di pianificazione. L'eventuale geometria/codice provinciale
            ISTAT resta utilizzabile solo come contenitore tecnico.
          geometry_role: technical_container_only
      intermunicipal_units:
        name: "Unités des Communes valdôtaines"
        count: 8
        plus: "Comune di Aosta"
        planning_level: false
        note: >
          Sono conservate come contesto amministrativo, ma non sostituiscono
          automaticamente il livello provinciale nella pipeline urbanistica.

    composition:
      fill_down_order: [PTP, PRG]
      municipal_override: true
      rule: >
        Il PTP costituisce il quadro sovraordinato; il PRG comunale aggiunge il
        dettaglio locale senza cancellare provenienza, prescrizioni e vincoli PTP.

    instruments:
      - key: PTP
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Paesistico"
        alternate_name: "Plan Territorial Paysager"
        plan_type: regolatore
        legal_basis:
          - "L.R. 13/1998 — approvazione del PTP"
          - "L.R. 11/1998 — normativa urbanistica e di pianificazione territoriale"
        coverage_scope: whole_region
        conformity_role: sovraordinato

      - key: PRG
        level: comune
        required: true
        expected_count: 74
        official_name: "Piano regolatore generale comunale urbanistico e paesaggistico"
        aliases: [PRG, PRGC]
        plan_type: regolatore
        legal_basis:
          - "L.R. 11/1998, art. 11"
          - "L.R. 17/2025 — modificazioni alla L.R. 11/1998"
        coverage_scope: each_municipality
        must_conform_to: PTP
        track:
          - availability
          - adaptation_to_ptp
          - approval_and_variant_dates
          - prescriptive_cartography

    not_expected:
      - key: PTCP
        level: provincia
        reason: "Livello provinciale urbanistico non presente nel modello valdostano."

    expected_datasets:
      PTP:
        - source_theme: "Assetto generale"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Siti, beni e aree di specifico interesse"
          canonical_classes: [VINCOLI_PAESAGGISTICI, AREE_PROTETTE]
        - source_theme: "Disciplina di uso e valorizzazione"
          canonical_classes: [PRG_ZONING, AGRICOLTURA]
        - source_theme: "Pericolosità geologica e idraulica"
          canonical_classes: [DISSESTO_GEOLOGICO, RISCHIO_IDRAULICO]
        - source_theme: "Vincoli paesaggistici"
          canonical_classes: [VINCOLI_PAESAGGISTICI]
      PRG:
        - source_theme: "Classificazione degli edifici"
          canonical_classes: [PRG_EDIFICI_STORICI]
        - source_theme: "Zone, sottozone e comparti"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Servizi"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Viabilità"
          canonical_classes: [VIABILITA]

    recognition_hints:
      priority_terms:
        - PTP
        - PRG
        - PRGC
        - "cartografia prescrittiva"
        - "ambiti inedificabili"
        - "pericolosità geologica"
        - "pericolosità idraulica"
        - valanghe
        - ghiacciai
      policy_priorities:
        - tutela_del_territorio_alpino
        - rischio_idrogeologico_e_valanghivo
        - conservazione_dei_terreni_agricoli
        - recupero_del_patrimonio_edilizio_storico

    official_portals:
      - key: planning_home
        purpose: "Normativa e accesso a PTP, PRG e varianti"
        url: "https://www.regione.vda.it/territorio/territorio/pianificazione_territoriale/default_i.asp"
      - key: ptp
        purpose: "Documenti e cartografie del PTP"
        url: "https://www.regione.vda.it/territorio/territorio/pianificazione_territoriale/ptr/default_i.asp"
      - key: prg_status
        purpose: "Stato di adeguamento dei PRG e provvedimenti comunali"
        url: "https://mappe.regione.vda.it/pub/geonavitg/geopiani.asp"
      - key: sct_download
        purpose: "Repertorio ufficiale per scaricare i dataset cartografici"
        url: "https://sct-outil.regione.vda.it/SCTProfessional/repertcarto/allrepertori"

    normative_updates:
      - key: lr_17_2025
        date: "2025-06-10"
        status: approved
        title: >
          Disposizioni in materia di urbanistica e pianificazione territoriale.
          Modificazioni alla L.R. 11/1998 e ad altre leggi regionali.
        processing_effect:
          - "versionare le regole applicate alle varianti urbanistiche"
          - "non attribuire a un PRG uno stato procedurale senza fonte e data"
          - "registrare separatamente gli esiti/procedimenti VAS quando disponibili"
        note: >
          La data ufficiale è 10 giugno 2025. Il riferimento a una pubblicazione
          nel luglio 2026 non viene assunto dal modello.
        source_url: "https://www.regione.vda.it/territorio/territorio/pianificazione_territoriale/Disciplina_normativa/default_i.aspx"

  "03":
    key: lombardia
    names:
      it: "Lombardia"
    special_statute: false
    languages: [it]

    territorial_model:
      planning_levels: [regione, provincia, comune]
      processing_order: [regione, provincia, comune]
      expected_provinces: 12
      expected_municipalities: 1501
      municipality_count_checked_at: "2026-07-29"
      province_roles:
        - {istat: "012", name: "Varese", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "013", name: "Como", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "014", name: "Sondrio", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "015", name: "Milano", authority_type: citta_metropolitana, expected_instrument: PTM}
        - {istat: "016", name: "Bergamo", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "017", name: "Brescia", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "018", name: "Pavia", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "019", name: "Cremona", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "020", name: "Mantova", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "097", name: "Lecco", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "098", name: "Lodi", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "108", name: "Monza e della Brianza", authority_type: provincia, expected_instrument: PTCP}
      registry_note: >
        Il servizio regionale dei limiti amministrativi espone 1.501 comuni
        correnti. Il registry locale va riallineato alle fusioni 2024 prima di
        dichiarare completa la copertura dei filtri comunali.

    composition:
      fill_down_order: [PTR, PPR, PTCP, PTM, PGT, COMPONENTE_GEOLOGICA]
      municipal_override: true
      mandatory_overlays: [COMPONENTE_GEOLOGICA]
      rule: >
        La previsione comunale va letta insieme alle disposizioni prevalenti del
        PTR/PPR e del PTCP o PTM. Il Documento di Piano esprime la strategia ma
        non produce effetti diretti sul regime giuridico dei suoli; per diritti,
        destinazioni e limiti operativi prevale il Piano delle Regole, integrato
        dal Piano dei Servizi e dalla componente geologica.

    instruments:
      - key: PTR
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Regionale"
        aliases: [PTR]
        plan_type: regolatore
        status: effective
        approved_at: "2025-11-18"
        effective_at: "2026-01-28"
        legal_basis:
          - "L.R. 12/2005"
          - "D.C.R. 1157/2025"
        coverage_scope: whole_region
        conformity_role: sovraordinato
        note: >
          Il PTR ha natura ed effetti di piano territoriale paesaggistico, ma
          per la disciplina paesaggistica vigente rinvia al PPR approvato nel
          2010, fino alla conclusione della nuova co-pianificazione.

      - key: PPR
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Paesaggistico Regionale"
        aliases: [PPR, Piano Territoriale Paesistico]
        plan_type: regolatore
        status: effective
        approved_at: "2010-01-19"
        legal_basis:
          - "L.R. 12/2005"
          - "D.Lgs. 42/2004"
          - "D.C.R. 951/2010"
        coverage_scope: whole_region
        conformity_role: sovraordinato

      - key: PTCP
        level: provincia
        required: true
        expected_count: 11
        official_name: "Piano Territoriale di Coordinamento Provinciale"
        plan_type: regolatore
        coverage_scope: provinces_except_milan

      - key: PTM
        level: provincia
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Metropolitano"
        plan_type: regolatore
        coverage_scope: ["Città metropolitana di Milano"]

      - key: PGT
        level: comune
        required: true
        expected_count: 1501
        official_name: "Piano di Governo del Territorio"
        aliases: [PGT]
        plan_type: regolatore
        legal_basis:
          - "L.R. 12/2005, artt. 6-10"
        coverage_scope: each_municipality
        components: [DOCUMENTO_DI_PIANO, PIANO_DEI_SERVIZI, PIANO_DELLE_REGOLE]
        track:
          - availability
          - approval_and_variant_dates
          - burl_effectiveness
          - plan_status
          - digital_cartography
          - pgtweb_document_url
          - ptr_ptcp_ptm_conformity

      - key: DOCUMENTO_DI_PIANO
        level: comune
        required: true
        parent: PGT
        official_name: "Documento di Piano"
        aliases: [DdP, DP]
        plan_type: regolatore
        legal_basis:
          - "L.R. 12/2005, art. 8"
        effect_on_land_rights: none_direct
        ordinary_validity_years: 5
        processing_rule: >
          Registrare scadenza, proroghe e disciplina transitoria. Nei comuni fino
          a 2.000 abitanti le previsioni sono a tempo indeterminato, ma il
          Documento di Piano va verificato e aggiornato almeno ogni cinque anni.

      - key: PIANO_DEI_SERVIZI
        level: comune
        required: true
        parent: PGT
        official_name: "Piano dei Servizi"
        aliases: [PdS, PS]
        plan_type: regolatore
        legal_basis:
          - "L.R. 12/2005, art. 9"
        themes: [servizi_esistenti, servizi_in_progetto, attrezzature_pubbliche]

      - key: PIANO_DELLE_REGOLE
        level: comune
        required: true
        parent: PGT
        official_name: "Piano delle Regole"
        aliases: [PdR, PR]
        plan_type: regolatore
        legal_basis:
          - "L.R. 12/2005, art. 10"
        conformity_role: conformativo
        themes:
          - tessuto_urbano_consolidato
          - aree_agricole
          - aree_di_valore_paesaggistico_ambientale
          - nuclei_di_antica_formazione
          - regole_e_parametri_edificatori

      - key: COMPONENTE_GEOLOGICA
        level: comune
        required: true
        expected_count: 1501
        official_name: "Componente geologica, idrogeologica e sismica del PGT"
        aliases: [Carta di fattibilità geologica, Fattibilità geologica]
        plan_type: regolatore
        legal_basis:
          - "L.R. 12/2005, art. 57"
        must_overlay: PGT
        classes:
          1: "Fattibilità senza particolari limitazioni"
          2: "Fattibilità con modeste limitazioni"
          3: "Fattibilità con consistenti limitazioni"
          4: "Fattibilità con gravi limitazioni"

    expected_datasets:
      PPR:
        - source_theme: "Ambiti ed elementi disciplinati dagli artt. 17-27"
          canonical_classes: [VINCOLI_PAESAGGISTICI]
        - source_theme: "Geositi, siti UNESCO e visuali paesaggistiche"
          canonical_classes: [VINCOLI_PAESAGGISTICI]
      PGT:
        - source_theme: "Stato del PGT e collegamento alla scheda PGTWEB"
          canonical_classes: [PIANI_MATURITA]
        - source_theme: "Ambiti del tessuto urbano consolidato"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Ambiti di trasformazione e rigenerazione"
          canonical_classes: [PRG_ZONING]
        - source_theme: "Aree agricole, servizi e impianti"
          canonical_classes: [PRG_ZONING, AGRICOLTURA]
        - source_theme: "Nuclei di antica formazione"
          canonical_classes: [PRG_EDIFICI_STORICI]
        - source_theme: "Fasce di rispetto e limitazioni"
          canonical_classes: [VINCOLI_COMUNALI]
        - source_theme: "Rete ecologica comunale"
          canonical_classes: [RETE_ECOLOGICA]
      COMPONENTE_GEOLOGICA:
        - source_theme: "Carta della fattibilità geologica"
          canonical_classes: [DISSESTO_GEOLOGICO]
        - source_theme: "Pericolosità sismica locale"
          canonical_classes: [DISSESTO_GEOLOGICO]

    recognition_hints:
      priority_terms:
        - PGT
        - "Documento di Piano"
        - "Piano dei Servizi"
        - "Piano delle Regole"
        - "Tavola delle Previsioni di Piano"
        - "ambiti di trasformazione"
        - "ambiti di rigenerazione"
        - "tessuto urbano consolidato"
        - "nuclei di antica formazione"
        - "carta del consumo di suolo"
        - "fattibilità geologica"
        - "pericolosità sismica locale"
      policy_priorities:
        - riduzione_del_consumo_di_suolo
        - rigenerazione_urbana_e_territoriale
        - recupero_del_patrimonio_dismesso
        - compatibilita_geologica_idrogeologica_e_sismica
        - tutela_delle_aree_agricole

    official_portals:
      - key: geoportal
        purpose: "Catalogo, download e servizi OGC/ArcGIS dei dati territoriali regionali"
        url: "https://www.geoportale.regione.lombardia.it/"
      - key: pgtweb
        purpose: "Archivio documentale e livelli informativi dei PGT comunali"
        url: "https://www.multiplan.servizirl.it/pgtwebn/"
      - key: regional_pgt_page
        purpose: "Disciplina e strumenti regionali per i PGT"
        url: "https://www.regione.lombardia.it/ambiente-e-territorio/pianificazione-territoriale/pianificazione-comunale-e-provinciale/piani-di-governo-del-territorio-pgt"
      - key: ptr
        purpose: "Piano Territoriale Regionale vigente dal 28 gennaio 2026"
        url: "https://www.regione.lombardia.it/ambiente-e-territorio/pianificazione-territoriale/pianificazione-regionale/piano-territoriale-regionale"
      - key: ppr
        purpose: "Piano Paesaggistico Regionale 2010 vigente"
        url: "https://www.regione.lombardia.it/ambiente-e-territorio/paesaggio/piano-paesaggistico-regionale-ppr"
      - key: planning_law
        purpose: "Testo coordinato della L.R. 12/2005"
        url: "https://normelombardia.consiglio.regione.lombardia.it/NormeLombardia/Accessibile/main.aspx?iddoc=lr002005031100012&view=showdoc"

    normative_updates:
      - key: lr_12_2005
        status: consolidated
        title: "Legge per il governo del territorio"
        processing_effect:
          - "distinguere i tre atti del PGT"
          - "non attribuire effetti conformativi diretti al Documento di Piano"
          - "controllare la validità quinquennale e le eventuali proroghe del Documento di Piano"
          - "sovrapporre sempre la componente geologica al Piano delle Regole"
          - "conservare data BURL perché determina l'efficacia del PGT"
        source_url: "https://normelombardia.consiglio.regione.lombardia.it/NormeLombardia/Accessibile/main.aspx?iddoc=lr002005031100012&view=showdoc"

  "05":
    key: veneto
    names:
      it: "Veneto"
    special_statute: false
    languages: [it]

    territorial_model:
      planning_levels: [regione, provincia, comune]
      processing_order: [regione, provincia, comune]
      expected_provinces: 7
      expected_municipalities: 559
      municipality_count_checked_at: "2026-07-29"
      province_roles:
        - {istat: "023", name: "Verona", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "024", name: "Vicenza", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "025", name: "Belluno", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "026", name: "Treviso", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "027", name: "Venezia", authority_type: citta_metropolitana, expected_instrument: PTCP}
        - {istat: "028", name: "Padova", authority_type: provincia, expected_instrument: PTCP}
        - {istat: "029", name: "Rovigo", authority_type: provincia, expected_instrument: PTCP}
      registry_note: >
        Il WFS regionale dei confini espone 559 comuni correnti. Il registro
        nazionale locale ne conserva ancora 563 perché precede le fusioni
        Gambugliano-Sovizzo, Castegnero-Nanto, Alano di Piave-Quero Vas e
        Carceri-Vighizzolo d'Este. Il download Veneto genera un overlay
        corrente senza riscrivere il registro storico nazionale.

    composition:
      fill_down_order: [PTRC, VINCOLI_PAESAGGISTICI, PTCP, PAT, PATI, PI, AUC]
      municipal_override: true
      mandatory_overlays: [CARTA_FRAGILITA, VINCOLI_PAESAGGISTICI, CONSUMO_SUOLO]
      rule: >
        Il PAT o PATI definisce struttura, invarianti, fragilità e limiti
        strategici; non basta per attribuire il regime operativo del lotto.
        La decisione comunale va letta nel PI vigente, insieme a NTA, PTCP,
        PTRC, vincoli paesaggistici e pericolosità. L'AUC della L.R. 14/2017
        descrive il perimetro urbanizzato e il contenimento del consumo di
        suolo, ma non equivale da sola a un diritto edificatorio.

    instruments:
      - key: PTRC
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Territoriale Regionale di Coordinamento"
        aliases: [PTRC]
        plan_type: regolatore
        status: effective
        approved_at: "2020-06-30"
        legal_basis:
          - "L.R. 11/2004"
          - "D.C.R. 62/2020"
        coverage_scope: whole_region
        conformity_role: sovraordinato
        note: >
          Il PTRC 2020 vigente non ha valenza di piano paesaggistico ai sensi
          del D.Lgs. 42/2004. I suoi temi paesaggistici sono conoscitivi e di
          coordinamento; i vincoli efficaci vanno acquisiti dalle fonti
          paesaggistiche vigenti e dai relativi provvedimenti.

      - key: PPR
        level: regione
        required: true
        expected_count: 1
        official_name: "Piano Paesaggistico Regionale"
        aliases: [PPR, "PTRC a valenza paesaggistica"]
        plan_type: regolatore
        status: in_preparation
        legal_basis:
          - "D.Lgs. 42/2004"
          - "L.R. 11/2004, artt. 45 bis e seguenti"
        coverage_scope: whole_region
        processing_rule: >
          Conservare lo stato procedurale e non trattare studi, ricognizioni o
          proposte del PPR come piano paesaggistico approvato.

      - key: PTCP
        level: provincia
        required: true
        expected_count: 7
        official_name: "Piano Territoriale di Coordinamento Provinciale"
        aliases: [PTCP]
        plan_type: regolatore
        coverage_scope: all_provinces_and_metropolitan_venice
        note: >
          La pagina regionale aggiornata al novembre 2025 censisce sette PTCP
          approvati, incluso quello di Venezia. Per Venezia il futuro
          strumento metropolitano è denominato PTGM, non PTM.

      - key: PAT
        level: comune
        required: true
        expected_count: 559
        official_name: "Piano di Assetto del Territorio"
        aliases: [PAT]
        plan_type: regolatore
        legal_basis:
          - "L.R. 11/2004, artt. 12-16"
        coverage_scope: each_municipality_or_pati
        conformity_role: strategico_strutturale
        track:
          - availability
          - approval_and_variant_dates
          - vincoli
          - invarianti
          - fragilita
          - trasformabilita

      - key: PATI
        level: comune
        required: false
        expected_count: dynamic
        official_name: "Piano di Assetto del Territorio Intercomunale"
        aliases: [PATI]
        plan_type: regolatore
        legal_basis:
          - "L.R. 11/2004, art. 16"
        coverage_scope: participating_municipalities
        conformity_role: strategico_strutturale_intercomunale

      - key: PI
        level: comune
        required: true
        expected_count: 559
        official_name: "Piano degli Interventi"
        aliases: [PI]
        plan_type: regolatore
        legal_basis:
          - "L.R. 11/2004, art. 17"
          - "L.R. 14/2017"
        coverage_scope: each_municipality
        must_conform_to: PAT
        conformity_role: operativo_conformativo
        track:
          - availability
          - approval_and_variant_dates
          - zonizzazione
          - indici_and_parameters
          - nta
          - five_year_expiry_of_transformative_predictions

      - key: AUC
        level: comune
        required: true
        expected_count: 559
        official_name: "Ambiti di urbanizzazione consolidata"
        aliases: [AUC]
        plan_type: regolatore
        legal_basis:
          - "L.R. 14/2017"
        coverage_scope: each_municipality
        conformity_role: consumo_suolo

    expected_datasets:
      PTRC:
        - source_theme: "Uso del suolo, terra e acqua"
          canonical_classes: [AGRICOLTURA, ACQUE]
        - source_theme: "Biodiversità e rete ecologica"
          canonical_classes: [AREE_PROTETTE, RETE_ECOLOGICA]
        - source_theme: "Idrogeologia e rischio sismico"
          canonical_classes: [RISCHIO_IDRAULICO, DISSESTO_GEOLOGICO, VINCOLO_IDROGEOLOGICO]
        - source_theme: "Mobilità e infrastrutture"
          canonical_classes: [VIABILITA, FERROVIA]
      PAT:
        - source_theme: "Carta dei vincoli e della pianificazione territoriale"
          canonical_classes: [VINCOLI_PAESAGGISTICI, VINCOLI_COMUNALI]
        - source_theme: "Carta delle invarianti"
          canonical_classes: [VINCOLI_COMUNALI, RETE_ECOLOGICA]
        - source_theme: "Carta delle fragilità"
          canonical_classes: [RISCHIO_IDRAULICO, DISSESTO_GEOLOGICO]
        - source_theme: "Carta della trasformabilità"
