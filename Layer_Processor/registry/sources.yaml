    status: active
    # VERIFICATO (download libero, senza autenticazione). Endpoint del viewer GeoPOI:
    api_base: "https://www1.agenziaentrate.gov.it/servizi/geopoi_omi/"
    endpoints:
      province: "zoneomi.php?richiesta=1"                                  # elenco province
      comuni: "zoneomi.php?richiesta=2&prov=<SIGLA>"                       # comuni (CODCOM Belfiore)
      semestri: "zoneomi.php?richiesta=5&prov=<SIGLA>"                     # semestri disponibili (2016→2025)
      perimetri_comune: "perimetri.php?prov=<SIGLA>&codcom=<BELFIORE>&semestre=<AAAAS>"  # ZIP geometrie zone OMI
      perimetri_provincia: "perimetri.php?prov=<SIGLA>&semestre=<AAAAS>"   # ZIP con tutti i comuni della provincia
      quotazioni_zona: "zoneomi.php?richiesta=8&codcom=<BELFIORE>&semestre=<AAAAS>&zo=<ZONA>"  # valori €/m² per zona
    notes: >
      Nazionale. Contiene PERIMETRI (geometrie zone OMI) + VALORI (quotazioni €/m²), per comune/
      provincia e per semestre. Download VERIFICATO: perimetri.php restituisce ZIP (es. AO/A205/20252
      = Allein, 7,7KB; per-provincia senza codcom = tutti i comuni). Cascata: richiesta=1 province →
      richiesta=2 comuni → richiesta=5 semestri → perimetri.php (geometrie) + richiesta=8 (valori).
      Completezza raggiungibile iterando ~110 province per semestre (più efficiente del per-comune).
      Alimenta il layer finale di composizione VALORI_OMI. Adapter: lib/omi.py (run.py omi).

