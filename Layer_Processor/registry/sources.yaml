# ============================================================================
# REGISTRY DELLE FONTI — da dove scaricare i layer.
# Guida gli stadi 01_discover e 02_download. Processate nell'ordine territoriale
# regione → provincia (+ area metropolitana) → comune.
#
# Ogni fonte:
#   key         identificatore ente, prefisso = livello (come in Torino):
#                 r_<reg>   regione        (es. r_piemon)
#                 p_<sigla> provincia      (es. p_to, p_bi)
#                 c_<istat> comune         (es. c_001272 = Torino)
#   livello     regione | provincia | comune
#   ente        nome leggibile
#   region      regione ISTAT (nome italiano, coerente col DB)
#   region_istat codice ISTAT regione a 2 cifre, collegato a territorial_registry
#   province    (per livello provincia/comune) sigla
#   province_istat codice ISTAT provincia a 3 cifre
#   comune_istat (per livello comune) codice 6 cifre
#   kind        geoportal_download | ckan | arcgis_rest | wfs | file_catalog | national_dataset
#   url         punto di ingresso (pagina opendata / endpoint / catalogo)
#   plan_types  [regolatore, operativo, stato] presenti attesi
#   status      active | todo | dead
#   notes       -
# ============================================================================

version: 1
planning_profiles_file: regional_planning_profiles.yaml

# Ripartizione amministrativa e alias usati per validare gli scope delle fonti.
# Il workbook resta la sorgente tabellare: non viene duplicato qui in migliaia
# di record. I codici sono identificatori testuali e conservano gli zeri iniziali.
territorial_registry:
  version: 1

  hierarchy:
    file: "../../Geography_Amministrativi/province+regioni+comuni.xlsx"
    province_sheet: Province
    municipality_sheets: [Comuni Nord, Comuni Sud]
    province_fields:
      name: Nome
      sigla: Sigla
      codice_istat: ISTAT
      region_name: Regione
      latitude: Latitudine
      longitude: Longitudine
    municipality_fields:
      province_istat: codice_prov_istat
      province_sigla: sigla_provincia
      province_name: provincia
      region_name: regione
      municipality_suffix: codice_comu_istat
      municipality_name: comune
      latitude: lat
      longitude: lng
      province_capital: capoluogo_prov
      region_capital: capoluogo_reg
    code_rules:
      province_istat: "left_pad(codice_prov_istat, 3, '0')"
      comune_istat: "province_istat + left_pad(codice_comu_istat, 3, '0')"
      source_key_regione: "r_<identificatore_fonte>"
      source_key_provincia: "p_<sigla_lower>"
      source_key_comune: "c_<comune_istat>"
    observed_counts:
      regions: 20
      provinces: 110
      municipality_rows_raw: 8092
      municipality_codes_raw_unique: 8091
    notes: >
      Le righe comunali includono denominazioni storiche e varianti. Non vanno
      considerate automaticamente comuni correnti: prima si applica il dizionario
      alias sottostante, con scope regione+sigla provincia.

  municipality_aliases:
    file: "../../pipeline/aliases/comune_aliases.csv"
    lookup_key: [scope_region, scope_prov_sigla, alias_norm]
    canonical_fields: [canonical_istat, canonical_name]
    alias_types:
      historical_fusion: 294
      spelling_variant: 28
      bilingual: 226
    rows: 548
    policy:
      - "normalizzare il nome con lib.normalize.norm_name"
      - "cercare l'alias nello scope regione+provincia"
      - "usare canonical_istat come codice definitivo"
      - "non inventare match se regione o provincia non coincidono"
      - "in assenza di match consultare comune_exceptions.csv e poi segnalare"

  # Mapping stabile nome regione → codice ISTAT. Serve a completare il workbook,
  # nel quale la regione è indicata per nome.
  regions:
    "01": Piemonte
    "02": "Valle d'Aosta"
    "03": Lombardia
    "04": "Trentino-Alto Adige"
    "05": Veneto
    "06": "Friuli-Venezia Giulia"
    "07": Liguria
    "08": "Emilia-Romagna"
    "09": Toscana
    "10": Umbria
    "11": Marche
    "12": Lazio
    "13": Abruzzo
    "14": Molise
    "15": Campania
    "16": Puglia
    "17": Basilicata
    "18": Calabria
    "19": Sicilia
    "20": Sardegna

