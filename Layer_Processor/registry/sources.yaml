    notes: >
      Fonte operativa principale del Veneto. Scoperta non congela nomi fisici
      soggetti ad aggiornamento: legge le configurazioni correnti dei WebGIS
      regionali 213 e 191 e le incrocia con GetCapabilities WFS. Attualmente
      trova 4 layer comunali (confini correnti, province, perimetri AUC della
      L.R. 14/2017 e zonizzazione del Piano Regolatore Comunale) e 266 layer
      PTRC 2020 unici; un confine amministrativo è comune ai due insiemi, per
      un totale di 269 download, deduplicando le ripetizioni tra tavole. La zonizzazione
      supera 386.000 geometrie: GetFeature è paginato e la dashboard elabora
      al massimo 10 layer per run, saltando quelli già completi. Il confine
      ufficiale espone 559 comuni correnti; quando viene scaricato genera
      automaticamente l'overlay amministrativo locale, sostituendo le 563
      geometrie storiche solo per il Veneto. Il WebGIS comunale è aggiornato
      trimestralmente e la Regione dichiara che la rappresentazione non ha
      valore conformativo: per la decisione finale restano necessarie NTA e
      atti ufficiali del singolo Comune.

