    catalog_section: "CARTE TEMATICHE"
    expected_map_count: 350
    dashboard_batch_size: 25
    # Mappe fuori dalla sezione CARTE TEMATICHE ma servite dallo stesso
    # map_config_endpoint: il Piano Paesaggistico Regionale (PPR) vive in un'app
    # dedicata del Geoportale. Le aggiungiamo al discovery così i loro layer WFS
    # entrano nel catalogo e vengono scaricati come gli altri (niente PDF, niente
    # file locali). 2098/2229/2100/2109 = 29 layer, tutti flagDownload via WFS.
    # 2156 (attività estrattive) e 755 (rete ecologica) sono già in CARTE TEMATICHE.
    extra_maps:
      - {id: 2098, category: "PIANO PAESAGGISTICO REGIONALE"}   # PPR - Ambiti e Unità di paesaggio
      - {id: 2229, category: "PIANO PAESAGGISTICO REGIONALE"}   # PPR - Componenti di Paesaggio
      - {id: 2100, category: "PIANO PAESAGGISTICO REGIONALE"}   # PPR - Vincoli Ope Legis art.142
      - {id: 2109, category: "PIANO PAESAGGISTICO REGIONALE"}   # PPR - Vincoli per decreto art.136
    included_categories:
      - "ACQUE INTERNE"
      - "ACQUE MARINE"
      - "AGRICOLTURA"
      - "AMBIENTE"
      - "BIOLOGIA"
      - "ECONOMIA"
      - "INFORMAZIONI GEOSCIENTIFICHE"
      - "PIANIFICAZIONE DEL TERRITORIO E CATASTO"
      - "RETI, INFRASTRUTTURE E SERVIZI DI COMUNICAZIONE"
      - "SALUTE"
      - "SOCIETA"
      - "STRUTTURE"
      - "TRASPORTO"
    plan_types: [regolatore, stato]
    planning_instruments: [PTCP paesistico, PPR, PTR, PTC, PTM, Piani di bacino, PUC]
    status: active
    notes: >
      Il discovery legge la sezione corrente CARTE TEMATICHE del catalogo
      ufficiale e risolve la configurazione di ciascuna mappa. Al 27 luglio 2026
      il catalogo espone 350 mappe tematiche, di cui 116 nella categoria
      Pianificazione del territorio e catasto. Il download usa i WFS ufficiali
      soltanto per i layer marcati scaricabili nella configurazione del portale.
      Applicare il profilo liguria: regione → provincia/metropolitana → comune.

