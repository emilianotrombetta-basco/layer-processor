# ============================================================================
# OBIETTIVI DELLO STADIO 04 · COMPOSIZIONE
#
# Sono prodotti cartografici, non semplici tabelle. Ogni feature conserva fonti,
# data di acquisizione, copertura e motivazioni. Il Semaforo è uno screening
# tecnico: non sostituisce certificato urbanistico, titolo edilizio, pareri o
# autorizzazioni degli enti competenti.
# ============================================================================

version: 1
crs: EPSG:4326
traceability_required: true
common_fields:
  - codice_istat
  - comune
  - provincia
  - regione
  - source_uuid
  - source_title
  - source_url
  - source_date
  - processed_at
  - coverage_status

targets:
  PIANI_MATURITA:
    title: "Stato di adeguamento dei piani regolatori comunali"
    geometry: municipality_polygon
    scale:
      overview: comune
      detail: comune
    source_plan_aliases: [PGT, PRG, PRGC, PUC, PSC, PAT, PATI]
    required_fields:
      - plan_name
      - plan_status_code
      - plan_status_label
      - cartography_status
      - procedure_date
    statuses:
      APPROVATO:
        label: "Testo definitivo approvato"
        rank: 6
      APPROVATO_CARTOGRAFIA_IN_CONSEGNA:
        label: "Testo definitivo approvato, cartografia in fase di consegna"
        rank: 5
      DEFINITIVO_IN_VALUTAZIONE:
        label: "Testo definitivo in corso di valutazione o sospeso per richiesta di integrazioni documentali"
        rank: 4
      BOZZA_VALUTATA:
        label: "Testo in bozza valutato, testo definitivo da valutare"
        rank: 3
      BOZZA_IN_VALUTAZIONE:
        label: "Testo in bozza in corso di valutazione o sospeso per richiesta di integrazioni documentali"
        rank: 2
      ITER_NON_AVVIATO:
        label: "Comune che non ha avviato l’iter di approvazione della variante generale"
        rank: 1
      NON_DETERMINATO:
        label: "Stato non determinabile con le fonti disponibili"
        rank: 0
    regional_mappings:
      valle_d_aosta:
        APP: APPROVATO
        APC: APPROVATO_CARTOGRAFIA_IN_CONSEGNA
        VIC: DEFINITIVO_IN_VALUTAZIONE
        BVT: BOZZA_VALUTATA
        BCV: BOZZA_IN_VALUTAZIONE
        AFF: BOZZA_IN_VALUTAZIONE
        INA: ITER_NON_AVVIATO
      lombardia:
        VIGENTE_CARTOGRAFIA_CARICATA: APPROVATO
        VIGENTE_CARTOGRAFIA_NON_CARICATA: APPROVATO_CARTOGRAFIA_IN_CONSEGNA
        APPROVAZIONE_NON_VIGENTE: DEFINITIVO_IN_VALUTAZIONE
        ADOZIONE: DEFINITIVO_IN_VALUTAZIONE
        AVVIO: BOZZA_IN_VALUTAZIONE
        DA_AVVIARE: ITER_NON_AVVIATO
        NON_DETERMINATO: NON_DETERMINATO

  VINCOLI_COMUNALI:
    title: "Vincoli e condizioni territoriali"
    geometry: source_geometry_clipped_to_municipality
    scale:
      overview: comune
      detail: "geometria originale del vincolo, ritagliata sul confine comunale"
    required_fields:
      - constraint_family
      - constraint_name
      - severity
      - effect
      - legal_reference
      - source_coverage_pct
    families:
      - key: inedificabilita_e_dissesto
        examples: [frane, valanghe, aree inondabili, PAI, PGRA]
      - key: paesaggio_e_beni_culturali
        examples: [vincoli paesaggistici, archeologici, beni culturali, centri storici]
      - key: natura_e_biodiversita
        examples: [parchi, riserve, Natura 2000, boschi, rete ecologica]
      - key: acque
        examples: [fasce fluviali, laghi, reticolo idrografico, demanio idrico]
      - key: infrastrutture_e_fasce_rispetto
        examples: [strade, ferrovie, aeroporti, elettrodotti, gasdotti, oleodotti, cimiteri]
      - key: rumore_e_salubrita
        examples: [zonizzazione acustica, industrie a rischio, siti contaminati]
      - key: disciplina_urbanistica
        examples: [limitazioni PRG/PUC, destinazioni d’uso, edifici tutelati]
    severity:
      blocking:
        meaning: "Divieto o incompatibilità esplicita nella fonte normativa."
      conditional:
        meaning: "Intervento subordinato a limiti, autorizzazioni o verifiche."
      informative:
        meaning: "Elemento utile all’attrattività, senza effetto edificatorio automatico."
      unknown:
        meaning: "Effetto non classificabile automaticamente; richiede revisione."

  SEMAFORO_EDIFICABILITA:
    title: "Semaforo di edificabilità"
    geometry: planning_zone_or_cadastral_parcel
    scale:
      overview: comune
      detail_priority: [particella_catastale, zona_urbanistica]
      fallback: none
      note: >
        Il dettaglio non viene inventato: se particelle o zone urbanistiche non
        sono disponibili, resta soltanto l’overview comunale con copertura
        incompleta.
    required_inputs:
      - municipal_boundary
      - current_planning_zone_or_parcel
      - complete_constraint_inventory
      - plan_status
    required_fields:
      - signal
      - intervention_mode
      - reasons
      - blocking_constraints
      - conditional_constraints
      - required_checks
      - source_coverage_pct
      - confidence
    rules:
      RED:
        label: "Non edificabile o interventi sull’esistente fortemente limitati"
        when: "almeno un vincolo blocking applicabile interseca l’unità"
      YELLOW:
        label: "Edificabilità o trasformazione condizionata"
        when: "nessun blocking e almeno un vincolo conditional applicabile"
      GREEN:
        label: "Potenzialmente edificabile o trasformabile"
        when: >
          nessun blocking/conditional rilevato, destinazione urbanistica
          compatibile e copertura delle fonti obbligatorie completa
        disclaimer: "Non equivale a un diritto edificatorio o a un titolo abilitativo."
      UNASSESSED:
        label: "Non valutabile per copertura insufficiente"
        when: "manca almeno un input obbligatorio o la sua copertura non è verificata"
        display_color: gray
    precedence: [UNASSESSED, RED, YELLOW, GREEN]

  # ==========================================================================
  # LAYER FINALI approvati (struttura mobilitylens.com/piattaforma, blocchi 1-3).
  # I 3 target sopra hanno già il builder in lib/compose_engine.py. Quelli sotto
  # sono DEFINIZIONI approvate in attesa del rispettivo builder: finché non è
  # implementato, compare in dashboard come 'assente'. Ogni layer conserva la
  # tracciabilità per feature (common_fields) e classi interne accendibili.
  # ==========================================================================

  # ---- Blocco 1 · Regole e costruibilità ----------------------------------
  ANALISI_URBANISTICA:
    title: "Analisi Urbanistica"
    block: 1
    plan_type: regolatore
    geometry: planning_zone_polygon
    scale: {overview: comune, detail: zona_urbanistica}
    sources: [PRG_ZONING, PRG_EDIFICI_STORICI, CATASTO, USI_POI_POLIGONALI]
    expresses: >
      Destinazioni d'uso normalizzate in classi semantiche uniformi su tutto il
      territorio, indipendenti dalle sigle locali del PRG. Include il catasto
      (fogli di mappa) come overlay accendibile dove il dato esiste.
    classes:
      - residenziale
      - produttivo
      - servizi_e_dotazioni
      - agricolo
      - verde_e_pregio_naturale
      - terziario_commerciale
      - turistico_ricettivo
      - polifunzionale
      - ambiti_di_trasformazione
      - edifici_di_valore_storico
      - fogli_catastali   # overlay catasto (cadastral_sheet_polygon), opzionale
      - usi_osservati_osm # overlay HOTOSM informativo, non prescrittivo
      - altro_da_verificare

  # ---- Blocco 2 · Ambiente e tutele (split di VINCOLI_COMUNALI) ------------
  # Due viste per comune derivate dall'inventario VINCOLI_COMUNALI (che resta la
  # base tecnica usata anche dal Semaforo): partizione per famiglia di vincolo.
  TUTELE_AMBIENTALI_PAESAGGISTICHE:
    title: "Tutele ambientali e paesaggistiche"
    block: 2
    plan_type: regolatore
    geometry: source_geometry_clipped_to_municipality
    derived_from: VINCOLI_COMUNALI
    families: [paesaggio_e_beni_culturali, natura_e_biodiversita, acque]
    sources: [AREE_PROTETTE, RETE_ECOLOGICA, VINCOLI_PAESAGGISTICI, ACQUE, AGRICOLTURA]
    required_fields: [constraint_family, constraint_name, severity, effect, legal_reference, source_coverage_pct]
    expresses: >
      Ciò che limita/condiziona la trasformazione per ragioni ambientali e
      paesaggistiche: aree protette e Natura 2000, rete ecologica, vincoli
      paesaggistici (D.Lgs 42/2004), acque tutelate, agricoltura di pregio.

  RISCHI_PERICOLOSITA:
    title: "Rischi e pericolosità"
    block: 2
    plan_type: regolatore
    geometry: source_geometry_clipped_to_municipality
    derived_from: VINCOLI_COMUNALI
    families: [inedificabilita_e_dissesto]
    sources: [RISCHIO_IDRAULICO, DISSESTO_GEOLOGICO, VINCOLO_IDROGEOLOGICO, ALLERTA_PROTEZIONE_CIVILE]
    required_fields: [constraint_family, constraint_name, severity, effect, legal_reference, source_coverage_pct]
    expresses: >
      Ciò che condiziona per sicurezza: pericolosità alluvioni (PGRA), fasce
      fluviali PAI, dissesto geologico (frane/inondabili/instabili), vincolo
      idrogeologico, zone di allertamento di protezione civile.

  # ---- Blocco 3 · Infrastrutture, servizi e attrattività · stato attuale ---
  MOBILITA_ACCESSIBILITA:
    title: "Mobilità e accessibilità"
    block: 3
    plan_type: stato
    geometry: mixed
    scale: {overview: territorio, detail: territorio}
    sources: [TPL, FERROVIA, METRO, CICLABILI, SHARING, RICARICA]
    expresses: "Rete TPL (GTFS), ferrovia/stazioni, metro, ciclabili, sharing e ricarica; punti uniti nelle linee."
    classes: [tpl_bus, tpl_tram, tpl_metro, tpl_ferro, ferrovia, stazioni, metro, ciclabili, sharing, ricarica]

  RETE_VIABILITA:
    title: "Rete stradale e viabilità"
    block: 3
    plan_type: stato
    geometry: mixed
    sources: [VIABILITA, SOSTA_ACCESSI, INFRASTRUTTURE_AINOP]
    expresses: >
      Gerarchia stradale (autostrade, statali, provinciali, comunali) + grafo
      urbano; sosta e accessi urbani (ZTL, aree pedonali, parcheggi, sensi unici,
      LOGES, aeroporti); opere infrastrutturali censite AINOP (stato attuale).
    classes:
      - autostrade
      - statali
      - provinciali
      - comunali
      - grafo_urbano
      - sosta_accessi   # ZTL, aree pedonali, parcheggi, sensi unici, LOGES, aeroporti
      - infrastrutture_ainop   # opere AINOP (punti), overlay accendibile

  SERVIZI_POLARITA:
    title: "Servizi e polarità"
    block: 3
    plan_type: stato
    geometry: point
    sources: [SERVIZI_ISTRUZIONE, SERVIZI_SANITA, SERVIZI_CULTURA_SPORT, SERVIZI_POI]
    expresses: "Dotazioni di prossimità: istruzione, sanità, cultura/sport, POI generici."
    classes: [istruzione, sanita, cultura_sport, poi]

  PUNTI_INTERESSE:
    title: "Punti di interesse"
    block: 3
    plan_type: stato
    geometry: point
    scale: {overview: comune, detail: punto}
    sources: [POI_PUNTUALI, DISTRIBUTORI_CARBURANTE]
    required_fields: [poi_family, poi_value, osm_id, osm_type]
    expresses: >
      POI nazionali OpenStreetMap/HOTOSM: servizi, attività, turismo e manufatti.
      È una base crowdsourced non esaustiva, distinta dalle fonti istituzionali.
    classes: [amenity, shop, tourism, man_made]

  COMMERCIO_PRODUTTIVO:
    title: "Commercio e sistema produttivo"
    block: 3
    plan_type: stato
    geometry: mixed
    sources: [COMMERCIO, MERCATI, POLI_PRODUTTIVI]
    expresses: "Attività commerciali, mercati/fiere, aree e poli produttivi."
    classes: [commercio, mercati, poli_produttivi]

  VALORI_OMI:
    title: "Valori immobiliari OMI"
    block: 3
    plan_type: stato
    geometry: polygon
    sources: [OMI_VALORI]
    expresses: "Valori di mercato (€/m²) per zona OMI / comune / quartiere, con gradiente di valore."

  DEMOGRAFIA:
    title: "Demografia"
    block: 3
    plan_type: stato
    geometry: polygon
    sources: [DEMOGRAFIA]
    expresses: >
      Popolazione, densità e composizione sociale per comune.
      Censimento permanente ISTAT 2023 (sezioni aggregate a comune) +
      Basi Territoriali 2021 + Variabili censuarie 2023 (cruscotto):
      abitazioni occupate/vuote, stranieri (UE/extra-UE), occupazione
      (15-64, genere), istruzione (laureati), famiglie unipersonali,
      indice vecchiaia/dipendenza, densità, IRPEF (se disponibile).

  ENERGIA_RETI:
    title: "Energia e reti"
    block: 3
    plan_type: stato
    geometry: mixed
    sources: [ENERGIA]
    expresses: "Impianti di produzione + reti (metanodotti/oleodotti) con fasce di rispetto."

  # ==========================================================================
  # NUOVI TARGET (2026-07-31, approvati dall'utente) — planned: true finché non
  # sono costruiti gli adapter delle fonti nazionali che li alimentano. I target
  # planned NON concorrono alla completezza della composizione.
  # ==========================================================================

  BENI_CULTURALI:
    title: "Beni culturali"
    block: 3
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [BENE_CULTURALE, VINCOLO_CULTURALE]
    expresses: >
      Patrimonio culturale per comune (ArCo/ICCD Knowledge Graph, 215.800 beni):
      conteggio per tipo (architettonico, archeologico, storico-artistico,
      demoetnoantropologico, mobili). Join per nome comune.
    classes: [architettonico, archeologico, storico_artistico, demoetnoantropologico, mobili]
    arco_source:
      source_ente: n_arco_beni_culturali
      dataset_key: beni_per_comune
      source_uuid: "n_arco_beni_culturali:beni_per_comune"
      source_title: "ArCo — Knowledge Graph del patrimonio culturale italiano (ICCD/MIC)"
      source_url: "http://wit.istc.cnr.it/arco/#dati"
      license: "CC BY-SA 4.0"
      attribution: "Ministero della Cultura — ArCo / ICCD / CNR-ISTC"
      type_map:
        HistoricOrArtisticProperty: storico_artistico
        ArchaeologicalProperty: archeologico
        ArchitecturalOrLandscapeHeritage: architettonico
        DemoEthnoAnthropologicalHeritage: demoetnoantropologico
        MovableCulturalProperty: mobili
        NaturalHeritage: naturalistico
        NumismaticProperty: numismatico
        PhotographicHeritage: fotografico
        MusicHeritage: musicale
        ScientificOrTechnologicalHeritage: scientifico_tecnologico

  CONNETTIVITA_DIGITALE:
    title: "Connettività digitale"
    block: 3
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [COPERTURA_BANDA]
    expresses: >
      Copertura a banda larga/ultralarga per comune (AGCOM): tecnologie e
      velocità disponibili, divario digitale.
    classes: [banda_ultralarga, banda_larga, digital_divide]
    tabular:
      source_ente: n_agcom_connettivita
      file: AGCOM_connettivita_comuni.csv
      code_column: pro_com
      code_zfill: 6
      sep: ";"
      drop_columns: [Regione, Provincia, Comune]
      source_uuid: "n_agcom_connettivita:consistenze_comuni"
      source_title: "AGCOM — Broadband Map: consistenze rete cablata (dati comunali)"
      source_url: "https://geo.agcom.it/reportistica/"
      license: "AGCOM — Broadband Map"
      attribution: "AGCOM — Broadband Map (art. 22 CCE)"
      class: banda_ultralarga

  TRASPARENZA_APPALTI:
    title: "Trasparenza e appalti"
    block: 4
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [APPALTO_PUBBLICO, FLUSSO_CASSA_ENTE]
    expresses: >
      Contratti pubblici OCDS (ANAC BDNCP) con top 5 categorie merceologiche
      CPV e opere pubbliche BDAP con finanziamenti per fonte (statali, europei,
      enti territoriali, privati) e top settori. 78% comuni con ANAC, 99% con BDAP.
    classes: [appalto, cassa]

  TURISMO_RICETTIVITA:
    title: "Turismo e ricettività"
    block: 3
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [STRUTTURA_RICETTIVA]
    expresses: >
      Capacità ricettiva per comune (ISTAT via Cruscotto Italia):
      strutture, letti, camere, indice di turisticità.
    classes: [alberghiero, extra_alberghiero]
    tabular:
      source_ente: n_cruscotto_italia
      file: cruscotto_turismo.csv
      code_column: codice_istat
      code_zfill: 6
      sep: ","
      drop_columns: []
      source_uuid: "n_cruscotto_italia:cruscotto_turismo"
      source_title: "Cruscotto Italia — ISTAT capacità esercizi ricettivi per comune"
      source_url: "https://cruscotto-italia.dati.gov.it"
      license: "IODL 2.0"
      attribution: "Cruscotto Italia — dati.gov.it (PCM-DTD) / ISTAT"
      class: alberghiero

  AMBIENTE_RIFIUTI:
    title: "Ambiente — rifiuti"
    block: 3
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [GESTIONE_RIFIUTI]
    expresses: >
      Produzione e gestione dei rifiuti urbani per comune (ISPRA catasto
      rifiuti): raccolta totale e differenziata.
    classes: [rifiuti_urbani, raccolta_differenziata]
    tabular:
      source_ente: n_ispra_rifiuti
      file: rifiuti_comunali_2024.csv
      code_column: IstatComune
      code_zfill: 6
      code_right: 6
      sep: ";"
      skip_header_rows: 1
      drop_columns: [Regione, Provincia, Comune, Popolazione, "Dato riferito a"]
      source_uuid: "n_ispra_rifiuti:rifiuti_comunali_2024"
      source_title: "ISPRA — Catasto rifiuti: produzione e raccolta differenziata comunale 2024"
      source_url: "https://www.catasto-rifiuti.isprambiente.it/"
      license: "ISPRA — Catasto rifiuti open data"
      attribution: "ISPRA — Catasto Nazionale dei Rifiuti"
      class: rifiuti_urbani

  CONSUMO_SUOLO:
    title: "Consumo di suolo"
    block: 3
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [LAND_TAKE]
    expresses: >
      Consumo di suolo per comune (ISPRA): incremento netto, lordo e ripristino
      dal 2006 al 2024, serie storica biennale.
    classes: [consumo_suolo, land_take]
    tabular:
      source_ente: n_ispra_suolo
      file: consumo_suolo_2006_2024.xlsx
      sheet: "Comuni_2006_2024"
      code_column: PRO_COM
      code_zfill: 6
      drop_columns: [Nome_Comune, Nome_Regione, Nome_Provincia]
      source_uuid: "n_ispra_suolo:consumo_suolo_2006_2024"
      source_title: "ISPRA — Consumo di suolo, dinamiche territoriali e servizi ecosistemici"
      source_url: "https://www.isprambiente.gov.it/it/attivita/suolo-e-territorio/suolo/il-consumo-di-suolo"
      license: "ISPRA — dati ambientali open data"
      attribution: "ISPRA — Rapporto sul consumo di suolo 2024"
      class: consumo_suolo

  CATASTO_PARTICELLE:
    title: "Catasto particelle"
    block: 1
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [CATASTO_PARTICELLA, CATASTO_FOGLIO]
    expresses: >
      Copertura catastale INSPIRE (Agenzia delle Entrate) per comune:
      conteggio fogli e particelle presenti nei dati INSPIRE locali (ITALIA/).
      19 regioni su 20 (manca la Provincia Autonoma TN-AA = tavolare).
    classes: [catasto_foglio, catasto_particella]
    catasto_source:
      source_uuid: "catasto_inspire:fogli_particelle"
      source_title: "Agenzia delle Entrate — Cartografia catastale INSPIRE"
      source_url: "https://www.agenziaentrate.gov.it/portale/web/guest/schede/fabbricatiterreni/consultazione-cartografia-catastale"
      license: "CC BY 4.0"
      attribution: "Agenzia delle Entrate — Cartografia catastale INSPIRE"

  TOPONOMASTICA_CIVICI:
    title: "Toponomastica e civici"
    block: 3
    plan_type: stato
    geometry: municipality_polygon
    scale: {overview: comune, detail: comune}
    sources: [CIVICO, STRADA]
    expresses: >
      Toponomastica nazionale ANNCSU (Agenzia Entrate + ISTAT): numero di
      strade e civici conferiti per comune, percentuale georeferenziati.
      Snapshot agosto 2026. High Value Dataset (Reg. UE 2023/138).
    classes: [civico, strada]
    tabular:
      source_ente: n_cruscotto_italia
      file: cruscotto_anncsu_civici.csv
      code_column: pro_com
      code_zfill: 6
      sep: ","
      drop_columns: []
      source_uuid: "n_cruscotto_italia:cruscotto_anncsu"
      source_title: "ANNCSU — Archivio Nazionale Numeri Civici e Strade Urbane"
      source_url: "https://anncsu.open.agenziaentrate.gov.it/"
      license: "CC BY 4.0 (High Value Dataset)"
      attribution: "ANNCSU — Agenzia delle Entrate + ISTAT (DPCM 12/05/2016)"
      class: civico

quality_gates:
  - "nessun GREEN se la copertura delle fonti obbligatorie non è completa"
  - "ogni RED o YELLOW deve riportare almeno una motivazione e una fonte"
  - "la geometria finale deve essere valida e in EPSG:4326"
  - "le feature senza codice ISTAT comunale vengono scartate e segnalate"
  - "una regola regionale non viene trasferita automaticamente a un’altra regione"
