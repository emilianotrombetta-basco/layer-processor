  - canonical: SERVIZI_CULTURA_SPORT
    topic_in: [society, structure]
    any: ["musei", "museo", "teatri", "teatro", "biblioteche", "impianti sportivi",
          "beni culturali", "unesco", "residenze sabaude", "cinema", "siti unesco"]
