  # ---- Energia ------------------------------------------------------------
  - canonical: ENERGIA
    topic_in: [utilitiesCommunication, structure, environment]
    any: ["centrali", "centrale idroelettrica", "metanodotti", "oleodotti",
          "teleriscaldamento", "biomassa", "idroelettrica", "elettrodotti",
