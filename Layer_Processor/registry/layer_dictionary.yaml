# ============================================================================
# DIZIONARIO DEI LAYER — formulazione sorgente → classe canonica.
# Governance come gli alias comuni (pipeline/aliases/NORMALIZATION_RULES.md):
#   - curato a mano, versionato;
#   - il matcher PROPONE, non fa auto-merge cieco;
#   - i non riconosciuti finiscono in work/proposals/ per revisione → si estende qui.
#
# Ogni regola:
#   canonical    chiave in canonical_taxonomy.yaml (obbligatoria)
#   topic_in     (opz.) categorie ISO ammesse; restringe e alza la precisione
#   any          almeno UNA di queste keyword (normalizzate: minuscolo, senza accenti)
#   all          (opz.) TUTTE queste keyword devono essere presenti
#   not_any      (opz.) se presente una di queste, la regola NON scatta
#   confidence   high | medium | low
#   examples     titoli reali osservati (documentazione + tracciabilità)
#
# Match: il titolo viene normalizzato e confrontato per sottostringa di token.
# Punteggio = specificità (all/topic/lunghezza keyword) * peso confidence.
# Le keyword sono in minuscolo senza accenti: "attivita", non "attività".
# ============================================================================

version: 1

