  - canonical: PRG_ZONING
    topic_in: [planningCadastre]
    any: ["piano regolatore", "prgc", "zonizzazione", "azzonamento",
          "destinazione d'uso", "zone urbanistiche", "ambiti normativi",
          "mosaicatura prg", "prg vigente"]
