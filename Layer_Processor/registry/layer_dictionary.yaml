  # ==========================================================================
  # ESTENSIONI · Trentino (PUP), Alto Adige (BZ) e Torino mosaico PRGC
  # Aggiunte da Claude (sessione 2026-07-30) per attivare il recognize su
  # r_tn_*, r_bz_* e p_to_prgc_mosaico. Regole PURAMENTE ADDITIVE (il matcher
  # tiene il best score: non tolgono nulla alle regole di Codex).
  #
  # Nota tecnica di progetto:
  #   - I layer PUP/BZ portano quasi tutti topic=planningCadastre (sono "piani"),
  #     che farebbe scattare il gate topic_in di molte classi. Perciò queste
  #     regole OMETTONO topic_in (una regola senza topic_in bypassa il gate).
  #   - Per evitare falsi positivi cross-regione le keyword sono ULTRA-SPECIFICHE:
  #     · Trentino → codici PUP univoci ("z101 p pup", "e105 p pup", ...);
  #     · Bolzano  → termini tedeschi (non collidono con le regioni italiane).
  # ==========================================================================

  # ---- Trentino · PUP (codici) --------------------------------------------
  - canonical: PRG_EDIFICI_STORICI
    any: ["a101 n pup", "a101 p pup"]
    confidence: high
    examples: ["Insediamenti storici principali (a101_n_pup)", "Insediamenti storici (a101_p_pup)"]

